[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pitmus"
version = "1.0.0"
description = "PITMuS: reconstruct PIT bytecode mutations as Java source"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "Apache-2.0" }
dependencies = ["javalang>=0.13.0"]

[tool.setuptools]
packages = ["shared"]
package-dir = { "" = "PITMuS" }
