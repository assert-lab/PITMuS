name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Byte-compile scripts
        run: python -m compileall -q scripts/

      - name: Import check
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import gen_dataset, inject"

      - name: Lint (advisory)
        run: ruff check scripts/ || true

      - name: Run unit tests
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "No tests yet - skipping. Add tests/ to enable this gate."
          fi
